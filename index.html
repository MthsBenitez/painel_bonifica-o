<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Bonificação | Qualidade Corporativa</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
                        dark: { bg: '#0b1120', surface: '#1e293b', border: '#334155' }
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Firebase (V8 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; }
        .glass-card { background: rgba(255, 255, 255, 1); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); border: 1px solid #f1f5f9; }
        .dark .glass-card { background: rgba(30, 41, 59, 1); border-color: #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .gradient-text { background: linear-gradient(to right, #2563eb, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .dark .gradient-text { background: linear-gradient(to right, #60a5fa, #93c5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        input[type="month"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; transition: 0.2s; }
        .dark input[type="month"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        input[type="month"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-dark-bg dark:text-slate-100 min-h-screen flex flex-col relative overflow-x-hidden selection:bg-blue-500 selection:text-white">

    <!-- Modal Global de Alertas -->
    <div id="global-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-dark-surface rounded-2xl shadow-2xl p-6 max-w-sm w-full mx-4 border border-slate-200 dark:border-dark-border transform transition-all">
            <h3 id="modal-title" class="text-lg font-bold mb-3 text-slate-800 dark:text-white flex items-center gap-2"></h3>
            <div id="modal-content" class="text-slate-600 dark:text-slate-300 text-sm mb-6 leading-relaxed"></div>
            <div id="modal-actions" class="flex justify-end gap-3"></div>
        </div>
    </div>

    <!-- Modal de Troca de Senha -->
    <div id="pwd-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-dark-surface rounded-2xl shadow-2xl p-6 max-w-sm w-full mx-4 border border-slate-200 dark:border-dark-border">
            <h3 class="text-lg font-bold mb-4 text-slate-800 dark:text-white flex items-center"><div class="w-8 h-8 rounded-full bg-blue-100 dark:bg-blue-900/50 flex items-center justify-center mr-3 text-blue-600 dark:text-blue-400"><i class="fa-solid fa-key"></i></div> Trocar Senha</h3>
            <input type="password" id="new-password-input" placeholder="Digite a nova senha..." class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-600 focus:ring-2 focus:ring-blue-500 mb-6 dark:text-white outline-none transition-all">
            <div class="flex justify-end gap-3">
                <button onclick="app.ui.closePwdModal()" class="px-4 py-2 bg-slate-100 dark:bg-slate-700/50 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg font-semibold text-sm transition-colors">Cancelar</button>
                <button onclick="app.auth.executeChangePassword()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold text-sm shadow-md transition-colors">Atualizar Senha</button>
            </div>
        </div>
    </div>

    <!-- VIEW LOGIN -->
    <div id="view-login" class="flex-1 flex items-center justify-center p-4 relative overflow-hidden">
        <!-- Background Elements -->
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-green-500/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="glass-card max-w-md w-full p-8 rounded-3xl shadow-xl text-center relative z-10">
            <div class="w-16 h-16 bg-gradient-to-br from-blue-600 to-blue-800 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-6 shadow-lg transform rotate-3">
                <i class="fa-solid fa-chart-pie -rotate-3"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-800 dark:text-white mb-2 tracking-tight">Portal de Resultados</h1>
            <p class="text-slate-500 dark:text-slate-400 mb-8 text-sm">Acompanhe seus indicadores de excelência.</p>
            
            <form onsubmit="event.preventDefault(); app.auth.login();" class="space-y-5">
                <div class="text-left">
                    <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-1.5">Matrícula (Login)</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="login-mat" required class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:text-white transition-all outline-none" placeholder="Sua matrícula corporativa">
                    </div>
                </div>
                <div class="text-left">
                    <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-1.5">Senha de Acesso</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="login-pwd" required class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:text-white transition-all outline-none" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-blue-500/25 transition-all transform hover:-translate-y-0.5 mt-2">
                    Acessar Dashboard
                </button>
            </form>
        </div>
    </div>

    <!-- VIEW APLICATIVO PRINCIPAL -->
    <div id="view-app" class="hidden flex-1 flex flex-col pb-16">
        
        <!-- Header -->
        <header class="bg-white dark:bg-[#0f172a] shadow-sm border-b border-slate-200 dark:border-slate-800 z-20 sticky top-0">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-blue-700 rounded-xl flex items-center justify-center shadow-md">
                            <i class="fa-solid fa-chart-pie text-white text-sm"></i>
                        </div>
                        <h1 class="font-extrabold text-lg tracking-tight text-slate-800 dark:text-white hidden sm:block">Portal de Bonificação</h1>
                    </div>
                    
                    <div class="flex items-center gap-3 sm:gap-4">
                        <!-- Mês Global -->
                        <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 transition-colors hover:border-blue-300 dark:hover:border-blue-500 group">
                            <i class="fa-regular fa-calendar-days text-blue-500 text-sm"></i>
                            <input type="month" id="global-month" onchange="app.changeMonth(this.value)" class="bg-transparent text-xs font-bold text-slate-700 dark:text-slate-200 outline-none uppercase cursor-pointer" title="Selecione o mês de referência">
                        </div>

                        <!-- Perfil -->
                        <div class="hidden sm:flex items-center gap-2 bg-slate-50 dark:bg-slate-800/50 px-3 py-1.5 rounded-lg border border-slate-100 dark:border-slate-700">
                            <div class="w-6 h-6 rounded-full bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 flex items-center justify-center text-xs"><i class="fa-solid fa-user"></i></div>
                            <span id="header-username" class="text-xs font-bold text-slate-700 dark:text-slate-300 tracking-wide uppercase truncate max-w-[120px]">USUÁRIO</span>
                        </div>
                        
                        <div class="h-6 w-px bg-slate-200 dark:bg-slate-700 hidden sm:block"></div>

                        <!-- Botão Tema -->
                        <button onclick="app.ui.toggleTheme()" class="text-slate-500 hover:text-blue-600 dark:text-slate-400 dark:hover:text-blue-400 transition-colors w-9 h-9 flex items-center justify-center rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                            <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
                        </button>
                        
                        <!-- Sair -->
                        <button onclick="app.auth.logout()" class="text-slate-500 hover:text-red-600 dark:text-slate-400 dark:hover:text-red-400 transition-colors w-9 h-9 flex items-center justify-center rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20" title="Sair do Sistema">
                            <i class="fa-solid fa-right-from-bracket text-lg"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Navegação Tabs -->
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 bg-slate-50 dark:bg-[#0f172a]">
                <nav class="flex space-x-2 pt-3 overflow-x-auto no-scrollbar" id="main-nav">
                    <!-- Injetado via JS -->
                </nav>
            </div>
        </header>

        <!-- Container de Conteúdo -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full relative z-10 flex-1">
            <div id="content-container" class="animate-fade-in">
                <!-- Views injetadas via JS -->
            </div>
        </main>
    </div>

    <!-- Scripts da Aplicação -->
    <script>
        const app = {
            // Configuração Firebase
            storage: {
                firebaseConfig: {
                    apiKey: "AIzaSyAgCs3t7AadsPv-k74kz5fU5G02ZT6Xm0I",
                    authDomain: "painel-de-bonificacao.firebaseapp.com",
                    databaseURL: "https://painel-de-bonificacao-default-rtdb.firebaseio.com/",
                    projectId: "painel-de-bonificacao",
                    storageBucket: "painel-de-bonificacao.firebasestorage.app",
                    messagingSenderId: "96589923224",
                    appId: "1:96589923224:web:c81d609302104c62f9a1ed"
                },
                init() {
                    if (!firebase.apps.length) { firebase.initializeApp(this.firebaseConfig); }
                    
                    firebase.database().ref('sistema_bonificacao').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            if (data.config) app.config = data.config;
                            if (data.users) {
                                app.users = data.users.map(u => {
                                    if(u.results && (u.results.g1 || u.results.g2)) {
                                        const oldData = {...u.results};
                                        u.results = { "2026-06": oldData };
                                    }
                                    if(!u.results) u.results = {};
                                    return u;
                                });
                            } else {
                                app.users = [];
                            }
                            if(app.currentUser || app.isAdmin) app.ui.refreshCurrentView();
                        } else {
                            this.saveConfig();
                            this.saveUsers();
                        }
                    });
                },
                saveUsers() { firebase.database().ref('sistema_bonificacao/users').set(app.users); },
                saveConfig() { firebase.database().ref('sistema_bonificacao/config').set(app.config); }
            },

            // Estado Global
            users: [],
            currentMonth: '', 
            config: {
                baseValue: 400,
                goals: [
                    { id: 'g1', title: "Monitorias Realizadas", weight: 0.20, type: 'percent', icon: 'fa-headphones' },
                    { id: 'g2', title: "Feedbacks Presenciais", weight: 0.20, type: 'percent', icon: 'fa-comments' },
                    { id: 'g3', title: "Calibragens", weight: 0.15, type: 'calibracao', icon: 'fa-scale-balanced' },
                    { id: 'g4', title: "Ações Presenciais", weight: 0.15, type: 'actions', icon: 'fa-people-group' },
                    { id: 'g5', title: "Frequência", weight: 0.10, type: 'boolean', icon: 'fa-calendar-check' },
                    { id: 'g6', title: "Avaliação Gestor", weight: 0.10, type: 'boolean', icon: 'fa-thumbs-up' },
                    { id: 'g7', title: "Ação Colaborativa", weight: 0.10, type: 'boolean', icon: 'fa-lightbulb' }
                ]
            },
            
            currentUser: null,
            isAdmin: false,
            currentTab: 'meu_painel',

            changeMonth(newMonthStr) {
                if(!newMonthStr) return;
                this.currentMonth = newMonthStr;
                this.ui.refreshCurrentView();
            },

            auth: {
                login() {
                    const mat = document.getElementById('login-mat').value.trim();
                    const pwd = document.getElementById('login-pwd').value.trim();
                    
                    if(mat === 'gestaosoft' && pwd === 'qualidade2026') {
                        app.isAdmin = true; app.currentUser = null; app.currentTab = 'dashboard_adm';
                        app.ui.showApp(); return;
                    }

                    const user = app.users.find(u => u.matricula === mat && u.senha === pwd);
                    if(user) {
                        app.isAdmin = false; app.currentUser = user; app.currentTab = 'meu_painel';
                        app.ui.showApp();
                    } else {
                        app.ui.showAlert("Acesso Negado", "Matrícula ou senha incorretos. Verifique suas credenciais e tente novamente.", "error");
                    }
                },
                logout() {
                    app.isAdmin = false; app.currentUser = null;
                    document.getElementById('login-mat').value = ''; document.getElementById('login-pwd').value = '';
                    document.getElementById('view-app').classList.add('hidden');
                    document.getElementById('view-login').classList.remove('hidden');
                },
                executeChangePassword() {
                    const newPwd = document.getElementById('new-password-input').value.trim();
                    if(newPwd.length < 4) return app.ui.showAlert("Aviso", "A senha deve ter pelo menos 4 caracteres.", "error");
                    
                    if(app.currentUser) {
                        const idx = app.users.findIndex(u => u.matricula === app.currentUser.matricula);
                        if(idx > -1) {
                            app.users[idx].senha = newPwd; app.currentUser.senha = newPwd;
                            app.storage.saveUsers(); app.ui.closePwdModal();
                            app.ui.showAlert("Sucesso", "Sua senha foi alterada com segurança.", "success");
                        }
                    }
                }
            },

            calc: {
                getGoalResult(goalId, resultsForMonth) {
                    if(!resultsForMonth || !resultsForMonth[goalId]) return { value: 0, mult: 0, received: 0, display: '-', raw: {} };
                    
                    const res = resultsForMonth[goalId];
                    const goalDef = app.config.goals.find(g => g.id === goalId);
                    const valueAllocated = app.config.baseValue * goalDef.weight;
                    let mult = 0; let display = '';

                    if(goalDef.type === 'percent') {
                        const meta = parseFloat(res.meta) || 0;
                        const real = parseFloat(res.real) || 0;
                        const pct = meta > 0 ? (real / meta) : 0;
                        
                        if(pct >= 1.0) mult = 1.0;
                        else if(pct >= 0.95) mult = 0.75;
                        else if(pct >= 0.90) mult = 0.50;
                        else mult = 0;
                        
                        display = `${meta > 0 ? (pct * 100).toFixed(1) : '0.0'}% atingido`;
                    }
                    else if(goalDef.type === 'calibracao') {
                        const count = parseInt(res.val) || 0;
                        if(count >= 2) mult = 1.0;
                        else if(count === 1) mult = 0.50;
                        else mult = 0;
                        display = `${count} Calibraç${count === 1 ? 'ão' : 'ões'}`;
                    }
                    else if(goalDef.type === 'actions') {
                        const count = parseInt(res.val) || 0;
                        if(count >= 5) mult = 1.0;
                        else if(count === 4) mult = 0.75;
                        else if(count === 3) mult = 0.50;
                        else mult = 0;
                        display = `${count} Aç${count === 1 ? 'ão' : 'ões'}`;
                    }
                    else if(goalDef.type === 'boolean') {
                        const atingido = (res.val === 'Sim');
                        mult = atingido ? 1.0 : 0;
                        display = atingido ? 'Concluído' : 'Não Atingido';
                    }

                    return { mult: mult, received: valueAllocated * mult, allocated: valueAllocated, display: display, raw: res };
                },
                
                getTotal(resultsForMonth) {
                    if(!resultsForMonth) return { received: 0, pct: 0 };
                    let totalReceived = 0;
                    app.config.goals.forEach(g => { totalReceived += this.getGoalResult(g.id, resultsForMonth).received; });
                    const pct = app.config.baseValue > 0 ? (totalReceived / app.config.baseValue) : 0;
                    return { received: totalReceived, pct: pct };
                }
            },

            ui: {
                init() {
                    this.checkTheme();
                    
                    const today = new Date();
                    const mm = String(today.getMonth() + 1).padStart(2, '0');
                    const yyyy = today.getFullYear();
                    app.currentMonth = `${yyyy}-${mm}`;
                    document.getElementById('global-month').value = app.currentMonth;

                    app.storage.init();
                    document.getElementById('view-login').classList.remove('hidden');
                },
                
                checkTheme() {
                    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                        document.documentElement.classList.add('dark');
                        document.getElementById('theme-icon').classList.replace('fa-moon', 'fa-sun');
                    } else {
                        document.documentElement.classList.remove('dark');
                        document.getElementById('theme-icon').classList.replace('fa-sun', 'fa-moon');
                    }
                },
                toggleTheme() {
                    const icon = document.getElementById('theme-icon');
                    if (document.documentElement.classList.contains('dark')) {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('theme', 'light');
                        icon.classList.replace('fa-sun', 'fa-moon');
                    } else {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('theme', 'dark');
                        icon.classList.replace('fa-moon', 'fa-sun');
                    }
                    this.refreshCurrentView();
                },

                showAlert(title, message, type = 'info') {
                    const color = type === 'success' ? 'text-green-500' : (type === 'error' ? 'text-red-500' : 'text-blue-500');
                    const icon = type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info');
                    
                    document.getElementById('modal-title').innerHTML = `<i class="fa-solid ${icon} ${color}"></i> ${title}`;
                    document.getElementById('modal-content').innerHTML = message;
                    document.getElementById('modal-actions').innerHTML = `<button onclick="document.getElementById('global-modal').classList.add('hidden')" class="px-5 py-2.5 bg-slate-100 dark:bg-slate-700/50 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-white rounded-lg font-bold text-sm transition-colors">Entendi</button>`;
                    document.getElementById('global-modal').classList.remove('hidden');
                },

                showConfirm(title, message, confirmCallbackStr, danger = false) {
                    document.getElementById('modal-title').innerHTML = title;
                    document.getElementById('modal-content').innerHTML = message;
                    const btnClass = danger ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700';
                    document.getElementById('modal-actions').innerHTML = `
                        <button onclick="document.getElementById('global-modal').classList.add('hidden')" class="px-4 py-2 bg-slate-100 dark:bg-slate-700/50 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg font-bold text-sm transition-colors">Cancelar</button>
                        <button onclick="document.getElementById('global-modal').classList.add('hidden'); ${confirmCallbackStr}" class="px-5 py-2 ${btnClass} text-white rounded-lg font-bold text-sm shadow-md transition-colors">Confirmar</button>
                    `;
                    document.getElementById('global-modal').classList.remove('hidden');
                },

                openPwdModal() { document.getElementById('new-password-input').value = ''; document.getElementById('pwd-modal').classList.remove('hidden'); },
                closePwdModal() { document.getElementById('pwd-modal').classList.add('hidden'); },

                showApp() {
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-app').classList.remove('hidden');
                    document.getElementById('header-username').textContent = app.isAdmin ? 'Administração' : app.currentUser.nome;
                    this.renderNav();
                    this.renderTab(app.currentTab);
                },

                renderNav() {
                    const nav = document.getElementById('main-nav');
                    let html = '';
                    const tabs = app.isAdmin 
                        ? [ {id:'dashboard_adm', label:'Visão Geral', icon:'fa-chart-line'}, {id:'cadastros', label:'Lançamentos & Equipe', icon:'fa-users-gear'}, {id:'meu_painel', label:'Visão Monitor', icon:'fa-user-check'}, {id:'configuracoes', label:'Gestão de Metas', icon:'fa-sliders'}, {id:'regras', label:'Regras', icon:'fa-book'}, {id:'calculadora', label:'Simulador', icon:'fa-calculator'}, {id:'calc_monitorias', label:'Calc. Operação', icon:'fa-stopwatch'} ]
                        : [ {id:'meu_painel', label:'Meus Resultados', icon:'fa-chart-pie'}, {id:'regras', label:'Regras e Critérios', icon:'fa-book-open'}, {id:'calculadora', label:'Simulador', icon:'fa-calculator'} ];
                    
                    tabs.forEach(t => {
                        const activeCls = app.currentTab === t.id ? 'bg-white dark:bg-dark-surface text-blue-600 dark:text-blue-400 border-t-2 border-blue-600 shadow-[0_-4px_6px_-2px_rgba(0,0,0,0.05)]' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 border-t-2 border-transparent';
                        html += `<button onclick="app.ui.renderTab('${t.id}')" class="px-5 py-3 font-semibold text-sm rounded-t-xl transition-all flex items-center gap-2 whitespace-nowrap ${activeCls}"><i class="fa-solid ${t.icon}"></i> ${t.label}</button>`;
                    });
                    nav.innerHTML = html;
                },

                refreshCurrentView() {
                    if(!document.getElementById('view-app').classList.contains('hidden')) {
                        this.renderTab(app.currentTab);
                    }
                },

                formatMonthLabel(isoMonth) {
                    if(!isoMonth) return '';
                    const [y, m] = isoMonth.split('-');
                    const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
                    return `${months[parseInt(m)-1]} de ${y}`;
                },

                renderTab(tabId) {

                    else if(tabId === 'calculadora') this.renderView_Calculadora(container);
                    else if(tabId === 'regras') this.renderView_Regras(container);
                    else if(tabId === 'calc_monitorias') this.renderView_CalcMonitorias(container);

                            <option value="">Selecione a matrícula do colaborador...</option>`;

                        html += `</select>`;

                    } else {

                    }
                    html += `</div></div>`;

                    if(!targetUser && app.isAdmin) {

                    }

                    const resultsForMonth = (targetUser.results && targetUser.results[app.currentMonth]) || {};
                    const total = app.calc.getTotal(resultsForMonth);
                    const isEmpty = Object.keys(resultsForMonth).length === 0;

                    if (isEmpty) {
                        html += `<div class="p-8 mb-8 text-center glass-card rounded-2xl bg-slate-50/50 dark:bg-slate-800/30">
                            <i class="fa-regular fa-folder-open text-4xl text-slate-300 dark:text-slate-600 mb-3"></i>
                            <p class="text-slate-500 dark:text-slate-400 font-medium">Não há dados lançados para ${targetUser.nome} no mês de ${monthLabel}.</p>
                        </div>`;
                    }

                    html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">`;
                    
                    app.config.goals.forEach(g => {
                        const r = app.calc.getGoalResult(g.id, resultsForMonth);
                        const isPercentGoal = g.type === 'percent';
                        const wPct = (g.weight * 100).toFixed(0);
                        const multColor = r.mult >= 1 ? 'text-green-500' : (r.mult > 0 ? 'text-yellow-500' : 'text-red-500');

                        html += `
                        <div class="glass-card rounded-2xl p-5 relative overflow-hidden flex flex-col justify-between group hover:shadow-md transition-shadow">
                            ${r.mult >= 1 && !isEmpty ? `<div class="absolute top-0 right-0 w-16 h-16 bg-green-500/10 rounded-bl-full -z-10 transition-transform group-hover:scale-110"></div>` : ''}
                            
                            <div class="flex justify-between items-start mb-5">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300">
                                        <i class="fa-solid ${g.icon}"></i>
                                    </div>
                                    <h3 class="font-bold text-sm text-slate-800 dark:text-slate-200 leading-tight w-24">${g.title}</h3>
                                </div>
                                <span class="bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 border border-blue-100 dark:border-blue-800/50 text-[10px] font-bold px-2 py-1 rounded-md">PESO ${wPct}%</span>

                        if(isPercentGoal) {

                                    <div class="text-center">
                                        <div class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide mb-1">Meta</div>
                                        <div class="bg-slate-50 dark:bg-slate-800/80 rounded-lg py-2 font-semibold text-slate-700 dark:text-slate-300 text-sm border border-slate-100 dark:border-slate-700">${r.raw.meta || '-'}</div>
                                    </div>
                                    <div class="text-center">
                                        <div class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide mb-1">Realizado</div>

                                    </div>
                                </div>
                                <div class="text-center bg-slate-50 dark:bg-slate-800/50 rounded-lg py-1.5 text-xs text-slate-500 dark:text-slate-400 border border-slate-100 dark:border-slate-700/50"><strong class="text-slate-700 dark:text-slate-200">${r.display}</strong></div>

                            const badgeColor = r.mult >= 1 ? 'bg-green-50 text-green-700 border-green-200 dark:bg-green-900/20 dark:text-green-400 dark:border-green-900/50' : 
                                               (r.mult > 0 ? 'bg-yellow-50 text-yellow-700 border-yellow-200 dark:bg-yellow-900/20 dark:text-yellow-400 dark:border-yellow-900/50' : 
                                               'bg-slate-50 text-slate-500 border-slate-200 dark:bg-slate-800/80 dark:text-slate-400 dark:border-slate-700');
                            html += `
                                <div class="flex items-center justify-center h-full">
                                    <div class="w-full text-center py-4 rounded-xl border font-bold text-sm ${badgeColor}">${r.display || 'Pendente'}</div>
                                </div>
                            `;
                        }

                        html += `
                            </div>
                            <div class="flex justify-between items-end border-t border-slate-100 dark:border-slate-800 pt-4 mt-auto">
                                <div>
                                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-0.5">Quadrante</div>
                                    <div class="text-sm font-black ${multColor}">${(r.mult * 100).toFixed(0)}% <span class="text-slate-300 dark:text-slate-600 text-xs font-normal">ating.</span></div>
                                </div>
                                <div class="text-right">
                                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-0.5">Bonificação Calculada</div>
                                    <div class="text-lg font-black text-slate-800 dark:text-slate-100">R$ ${r.received.toFixed(2)}</div>
                                </div>
                            </div>
                        </div>`;
                    });
                    html += `</div>`;

                    const finalPct = (total.pct * 100).toFixed(1);
                    html += `
                        <div class="bg-gradient-to-r from-blue-900 to-slate-900 rounded-3xl p-6 md:p-8 shadow-xl flex flex-col md:flex-row justify-between items-center mt-4 relative overflow-hidden">

                            <div class="z-10 relative">
                                <div class="text-xs font-bold text-blue-300/80 uppercase tracking-widest mb-2">Resumo Financeiro • ${monthLabel}</div>
                                <div class="flex items-baseline gap-3">
                                    <span class="text-4xl md:text-5xl font-black text-white">${finalPct}%</span>
                                    <span class="text-blue-200 text-sm font-medium">Aproveitamento Total</span>
                                </div>
                            </div>
                            <div class="mt-6 md:mt-0 text-right bg-white/10 backdrop-blur-md px-8 py-5 rounded-2xl border border-white/20 z-10 relative w-full md:w-auto">
                                <div class="text-xs font-bold text-green-300 uppercase tracking-widest mb-1">Bonificação Conquistada</div>
                                <div class="text-4xl font-black text-green-400 drop-shadow-md">R$ ${total.received.toFixed(2)}</div>
                            </div>
                        </div>
                    `;
                    container.innerHTML = html;
                },

                refreshMeuPainelAdm() {
                    window.selectedViewUser = document.getElementById('adm-view-user').value;
                    this.renderTab('meu_painel');
                },

                renderView_DashboardAdm(container) {
                    if(!app.isAdmin) return;
                    const monthLabel = this.formatMonthLabel(app.currentMonth);
                    
                    let totalCusto = 0; let somaPct = 0; let usersComResultado = 0;
                    const goalStats = {};
                    app.config.goals.forEach(g => { goalStats[g.id] = { name: g.title, somaMult: 0, somaVal: 0, count: 0, worstUsers: [] }; });

                    app.users.forEach(u => {
                        const resultsForMonth = (u.results && u.results[app.currentMonth]);
                        if(resultsForMonth && Object.keys(resultsForMonth).length > 0) {
                            usersComResultado++;
                            const t = app.calc.getTotal(resultsForMonth);
                            totalCusto += t.received;
                            somaPct += t.pct;

                            app.config.goals.forEach(g => {
                                const res = app.calc.getGoalResult(g.id, resultsForMonth);
                                goalStats[g.id].somaMult += res.mult;
                                goalStats[g.id].somaVal += res.received;
                                goalStats[g.id].count++;
                                goalStats[g.id].worstUsers.push({ nome: u.nome, mult: res.mult });
                            });
                        }
                    });

                    const mediaGeral = usersComResultado > 0 ? ((somaPct / usersComResultado) * 100).toFixed(1) : 0;

                    let html = `
                        <div class="mb-8">
                            <h2 class="text-2xl font-extrabold text-slate-800 dark:text-white tracking-tight">Dashboard Executivo</h2>
                            <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Indicadores coletivos da equipe referente a <strong class="text-blue-600 dark:text-blue-400">${monthLabel}</strong>.</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div class="glass-card p-6 rounded-3xl flex items-center gap-5 border-l-4 border-l-green-500">
                                <div class="w-14 h-14 rounded-2xl bg-green-50 dark:bg-green-900/20 text-green-600 dark:text-green-400 flex items-center justify-center text-2xl"><i class="fa-solid fa-sack-dollar"></i></div>
                                <div>
                                    <div class="text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1">Custo Total (Mês)</div>
                                    <div class="text-3xl font-black text-slate-800 dark:text-white">R$ ${totalCusto.toFixed(2)}</div>
                                </div>
                            </div>
                            <div class="glass-card p-6 rounded-3xl flex items-center gap-5 border-l-4 border-l-blue-500">
                                <div class="w-14 h-14 rounded-2xl bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 flex items-center justify-center text-2xl"><i class="fa-solid fa-users-viewfinder"></i></div>
                                <div>
                                    <div class="text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1">Avaliados / Equipe</div>
                                    <div class="text-3xl font-black text-slate-800 dark:text-white">${usersComResultado} <span class="text-slate-300 dark:text-slate-600 font-medium text-lg">/ ${app.users.length}</span></div>
                                </div>
                            </div>
                            <div class="glass-card p-6 rounded-3xl flex items-center gap-5 border-l-4 border-l-purple-500">
                                <div class="w-14 h-14 rounded-2xl bg-purple-50 dark:bg-purple-900/20 text-purple-600 dark:text-purple-400 flex items-center justify-center text-2xl"><i class="fa-solid fa-chart-simple"></i></div>
                                <div>
                                    <div class="text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1">Média de Qualidade</div>
                                    <div class="text-3xl font-black text-slate-800 dark:text-white">${mediaGeral}%</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                            <div class="glass-card p-6 rounded-3xl">
                                <h3 class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-6">Aproveitamento Médio (%)</h3>
                                <div class="relative h-[280px] w-full"><canvas id="chart-pct"></canvas></div>
                            </div>
                            <div class="glass-card p-6 rounded-3xl">
                                <h3 class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-6">Distribuição Financeira (R$)</h3>
                                <div class="relative h-[280px] w-full"><canvas id="chart-finance"></canvas></div>
                            </div>
                        </div>

                        <div class="glass-card p-8 rounded-3xl mb-8">
                            <h3 class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-6">Foco de Melhoria (Ofensores)</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    `;

                    const labels = []; const dataPct = []; const dataVal = [];

                    Object.values(goalStats).forEach(gs => {
                        const avgPct = gs.count > 0 ? (gs.somaMult / gs.count) * 100 : 0;
                        labels.push(gs.name); dataPct.push(avgPct.toFixed(1)); dataVal.push(gs.somaVal.toFixed(2));
                        
                        gs.worstUsers.sort((a,b) => a.mult - b.mult);
                        const worst = gs.worstUsers.slice(0, 3).filter(u => u.mult < 1); 
                        
                        html += `
                            <div class="bg-slate-50 dark:bg-slate-800/30 p-5 rounded-2xl border border-slate-100 dark:border-slate-700/50">
                                <div class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase mb-3 truncate" title="${gs.name}">${gs.name}</div>
                                ${worst.length === 0 ? `<div class="flex items-center gap-2 text-sm font-medium text-green-500"><i class="fa-solid fa-shield-check"></i> Meta Blindada</div>` : 
                                    worst.map(w => `<div class="flex justify-between items-center text-sm py-1.5 border-b border-slate-100 dark:border-slate-700 last:border-0"><span class="text-slate-700 dark:text-slate-300 truncate pr-2">${w.nome}</span><span class="font-bold text-red-500 bg-red-50 dark:bg-red-900/20 px-2 py-0.5 rounded text-xs">${(w.mult*100).toFixed(0)}%</span></div>`).join('')
                                }
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                    container.innerHTML = html;

                    setTimeout(() => {
                        const isDark = document.documentElement.classList.contains('dark');
                        const textColor = isDark ? '#94a3b8' : '#64748b';
                        const gridColor = isDark ? '#334155' : '#e2e8f0';

                        if(window.myChartPct) window.myChartPct.destroy();
                        window.myChartPct = new Chart(document.getElementById('chart-pct'), {
                            type: 'bar',
                            data: { labels: labels, datasets: [{ label: 'Aproveitamento (%)', data: dataPct, backgroundColor: '#3b82f6', borderRadius: 6 }] },
                            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100, ticks: {color: textColor}, grid: {color: gridColor} }, x: { ticks: {color: textColor}, grid: {display: false} } }, plugins: { legend: { display: false } } }
                        });

                        if(window.myChartFin) window.myChartFin.destroy();
                        window.myChartFin = new Chart(document.getElementById('chart-finance'), {
                            type: 'bar',
                            data: { labels: labels, datasets: [{ label: 'Valor Pago (R$)', data: dataVal, backgroundColor: '#10b981', borderRadius: 6 }] },
                            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: {color: textColor}, grid: {color: gridColor} }, x: { ticks: {color: textColor}, grid: {display: false} } }, plugins: { legend: { display: false } } }
                        });
                    }, 50);
                },

                },

                renderView_Config(container) {

                    app.config.goals.forEach((g, i) => {
                        html += `

                    const horas = parseFloat(document.getElementById('dim-horas').value) || 0;

                    const outras = parseFloat(document.getElementById('dim-outras').value) || 0;
                    const tmo = parseFloat(document.getElementById('dim-tmo').value) || 0;
                    const tmf = parseFloat(document.getElementById('dim-tmf').value) || 0;
                    const dias = parseFloat(document.getElementById('dim-dias').value) || 0;

                    const totalMins = Math.floor(horas * 60);
                    const produtivo = totalMins - pausas - outras;
                    const tempoPorAvaliacao = tmo + tmf;

                    let metaDia = 0;
                    let metaMes = 0;

                    if (produtivo > 0 && tempoPorAvaliacao > 0) {
                        metaDia = Math.floor(produtivo / tempoPorAvaliacao);
                        metaMes = metaDia * dias;
                    }

                    const safeProdutivo = Math.max(0, produtivo);
                    const hrsProd = Math.floor(safeProdutivo / 60);
                    const minsProd = safeProdutivo % 60;

                    document.getElementById('dim-res-produtivo').textContent = `${hrsProd}h ${minsProd}m`;

                    document.getElementById('dim-res-mes').textContent = metaMes;

                                        <li class="flex justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/50"><span class="font-medium text-slate-600 dark:text-slate-300">5 Ações</span><strong class="text-green-500">100% da bonificação</strong></li>
                                        <li class="flex justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/50"><span class="font-medium text-slate-600 dark:text-slate-300">4 Ações</span><strong class="text-blue-500">75% da bonificação</strong></li>
                                        <li class="flex justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/50"><span class="font-medium text-slate-600 dark:text-slate-300">3 Ações</span><strong class="text-orange-500">50% da bonificação</strong></li>
                                        <li class="flex justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/50"><span class="font-medium text-slate-600 dark:text-slate-300">Menos de 3</span><strong class="text-red-500">0% da bonificação</strong></li>
                                    </ul>
                                </div>
                            </div>
                            
                            <!-- Indicadores Condicionantes -->
                            <div class="glass-card p-8 rounded-3xl">
                                <h3 class="font-extrabold text-lg mb-4 text-slate-800 dark:text-white flex items-center gap-3"><div class="w-10 h-10 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 flex items-center justify-center rounded-xl"><i class="fa-solid fa-toggle-on"></i></div> Indicadores Condicionantes (Binários)</h3>
                                <p class="text-sm text-slate-600 dark:text-slate-400 mb-6 leading-relaxed">Metas focadas em atitude, cultura e compromisso primário. Se a regra for cumprida (Sim), recebe-se o valor integral daquele peso (100%). Se houver desvio (Não), perde-se o valor atrelado à meta (0%).</p>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div class="p-4 border border-slate-200 dark:border-slate-700 rounded-2xl bg-white dark:bg-dark-surface">
                                        <div class="font-bold text-slate-800 dark:text-white text-sm mb-1">Frequência</div>
                                        <div class="text-xs text-slate-500">Reconhece a presença ativa e o compromisso contínuo com as rotinas da operação, fatores fundamentais para a estabilidade e qualidade do atendimento.</div>
                                    </div>
                                    <div class="p-4 border border-slate-200 dark:border-slate-700 rounded-2xl bg-white dark:bg-dark-surface">
                                        <div class="font-bold text-slate-800 dark:text-white text-sm mb-1">Avaliação do Gestor</div>
                                        <div class="text-xs text-slate-500">Reflete percepção comportamental, postura profissional e alinhamento diário.</div>
                                    </div>
                                    <div class="p-4 border border-slate-200 dark:border-slate-700 rounded-2xl bg-white dark:bg-dark-surface">
                                        <div class="font-bold text-slate-800 dark:text-white text-sm mb-1">Ação Colaborativa</div>
                                        <div class="text-xs text-slate-500">Reconhece o apoio extra e a proatividade direcionada ao fortalecimento da equipe.</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML = html;
                }
            },

            admin: {
                registerUser() {
                    const n = document.getElementById('cad-nome').value.trim();
                    const m = document.getElementById('cad-mat').value.trim();
                    const p = document.getElementById('cad-pwd').value.trim();
                    if(!n || !m || !p) return app.ui.showAlert("Aviso", "Por favor, preencha todos os campos do novo colaborador.", "error");
                    if(app.users.find(u => u.matricula === m)) return app.ui.showAlert("Conflito", "Esta matrícula já está registrada no sistema.", "error");
                    
                    app.users.push({ nome: n, matricula: m, senha: p, results: {} });
                    app.storage.saveUsers();
                    document.getElementById('cad-nome').value = ''; document.getElementById('cad-mat').value = ''; document.getElementById('cad-pwd').value = '';
                    app.ui.showAlert("Sucesso", "Novo membro da equipe adicionado com sucesso!", "success");
                    app.ui.refreshCurrentView();
                },

                loadUserEditor() {
                    const mat = document.getElementById('adm-user-select').value;
                    const area = document.getElementById('adm-editor-area');
                    if(!mat) { area.classList.add('hidden'); return; }
                    
                    const u = app.users.find(x => x.matricula === mat);
                    const res = (u.results && u.results[app.currentMonth]) || {};
                    
                    let html = `
                        <div class="flex justify-between items-center bg-slate-100 dark:bg-slate-800/50 p-4 rounded-2xl mb-6 border border-slate-200 dark:border-slate-700/50">
                            <div><span class="text-[10px] text-slate-400 dark:text-slate-500 block uppercase tracking-widest font-bold mb-1">Credencial Atual:</span><code class="text-sm font-bold text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 px-3 py-1 rounded-md border border-slate-200 dark:border-slate-700">${u.senha}</code></div>
                            <div class="flex gap-2">
                                <button onclick="app.admin.clearUser()" class="px-4 py-2 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 rounded-xl text-xs font-bold transition shadow-sm text-slate-600 dark:text-slate-300" title="Apagar dados deste mês">Zerar Mês</button>
                                <button onclick="app.admin.deleteUser()" class="px-4 py-2 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/40 rounded-xl text-xs font-bold transition shadow-sm border border-red-100 dark:border-red-900/50" title="Excluir Colaborador"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                    `;

                    app.config.goals.forEach(g => {
                        const val = res[g.id] || {};
                        html += `<div class="bg-white dark:bg-slate-800/80 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm relative overflow-hidden focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-transparent transition-all">
                            <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-200 mb-4 truncate"><i class="fa-solid ${g.icon} text-blue-500 mr-2"></i> ${g.title}</label>
                        `;
                        
                        if(g.type === 'percent') {
                            html += `
                                <div class="flex gap-3">
                                    <div class="flex-1"><span class="text-[10px] text-slate-400 dark:text-slate-500 block mb-1.5 uppercase font-bold tracking-wider">Meta</span><input type="number" id="ed-${g.id}-meta" class="w-full p-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none" value="${val.meta || ''}"></div>
                                    <div class="flex-1"><span class="text-[10px] text-blue-500 block mb-1.5 uppercase font-bold tracking-wider">Realizado</span><input type="number" id="ed-${g.id}-real" class="w-full p-2.5 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-lg text-sm font-bold text-blue-700 dark:text-blue-400 outline-none" value="${val.real || ''}"></div>
                                </div>
                            `;
                        } else if(g.type === 'calibracao') {
                            html += `<div class="mt-1"><span class="text-[10px] text-blue-500 block mb-1.5 uppercase font-bold tracking-wider">Qtd Calibrações (0 a 2)</span><input type="number" id="ed-${g.id}-val" class="w-full p-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none" placeholder="0 a 2" min="0" max="2" value="${val.val || ''}"></div>`;
                        } else if(g.type === 'actions') {
                            html += `<div class="mt-1"><span class="text-[10px] text-blue-500 block mb-1.5 uppercase font-bold tracking-wider">Qtd Ações (0 a 5)</span><input type="number" id="ed-${g.id}-val" class="w-full p-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none" placeholder="0 a 5" min="0" max="5" value="${val.val || ''}"></div>`;
                        } else {
                            html += `<div class="mt-1"><span class="text-[10px] text-blue-500 block mb-1.5 uppercase font-bold tracking-wider">Cumprimento</span><select id="ed-${g.id}-val" class="w-full p-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none cursor-pointer">
                                <option value="" ${!val.val ? 'selected':''}>Não Preenchido</option>
                                <option value="Sim" ${val.val==='Sim'?'selected':''}>Sim (Atingiu)</option>
                                <option value="Não" ${val.val==='Não'?'selected':''}>Não (Falhou)</option>
                            </select></div>`;
                        }
                        html += `</div>`;
                    });

                    html += `
                        </div>
                        <div class="mt-6 pt-6 border-t border-slate-100 dark:border-slate-800">
                            <button onclick="app.admin.saveUserResults()" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-4 px-4 rounded-xl shadow-lg shadow-blue-500/20 hover:shadow-blue-500/40 transition-all transform hover:-translate-y-0.5 text-sm uppercase tracking-wider">
                                <i class="fa-solid fa-floppy-disk mr-2"></i> Gravar Lançamentos de ${app.ui.formatMonthLabel(app.currentMonth)}
                            </button>
                        </div>
                    `;
                    area.innerHTML = html;
                    area.classList.remove('hidden');
                },

                saveUserResults() {
                    const mat = document.getElementById('adm-user-select').value;
                    const u = app.users.find(x => x.matricula === mat);
                    if(!u) return;

                    const newRes = {};
                    app.config.goals.forEach(g => {
                        if(g.type === 'percent') {
                            const m = document.getElementById(`ed-${g.id}-meta`).value;
                            const r = document.getElementById(`ed-${g.id}-real`).value;
                            if(m !== '' || r !== '') newRes[g.id] = { meta: m, real: r };
                        } else {
                            const v = document.getElementById(`ed-${g.id}-val`).value;
                            if(v !== '') newRes[g.id] = { val: v };
                        }
                    });
                    
                    if(!u.results) u.results = {};
                    u.results[app.currentMonth] = newRes;
                    
                    app.storage.saveUsers();
                    app.ui.showAlert("Lançamento Salvo", `Os resultados para <strong>${app.ui.formatMonthLabel(app.currentMonth)}</strong> foram gravados com sucesso.`, "success");
                },

                clearUser() { app.ui.showConfirm("Limpar Lançamentos", `Isso irá ZERAR as notas do colaborador apenas no mês de <strong>${app.ui.formatMonthLabel(app.currentMonth)}</strong>. Confirmar?`, "app.admin.executeClearUser()", true); },
                executeClearUser() {
                    const u = app.users.find(x => x.matricula === document.getElementById('adm-user-select').value);
                    if(u && u.results) { delete u.results[app.currentMonth]; app.storage.saveUsers(); this.loadUserEditor(); }
                },

                deleteUser() { app.ui.showConfirm("Remover Colaborador", "Isso excluirá o acesso do colaborador e todo o seu histórico permanentemente. Prosseguir?", "app.admin.executeDeleteUser()", true); },
                executeDeleteUser() {
                    app.users = app.users.filter(u => u.matricula !== document.getElementById('adm-user-select').value);
                    app.storage.saveUsers();
                    app.ui.refreshCurrentView();
                },

                updateConfigPreview() {
                    let wTotal = 0;
                    app.config.goals.forEach((g, i) => {
                        const val = parseFloat(document.getElementById(`cfg-w-${i}`).value) || 0;
                        wTotal += val;
                        document.getElementById(`cfg-p-${i}`).textContent = `${(val*100).toFixed(0)}%`;
                    });
                    document.getElementById('cfg-total-w').textContent = wTotal.toFixed(2);
                    document.getElementById('cfg-total-p').textContent = `${(wTotal*100).toFixed(0)}%`;
                    if(Math.abs(wTotal - 1.0) > 0.001) document.getElementById('cfg-total-p').classList.replace('text-blue-400', 'text-red-500');
                    else document.getElementById('cfg-total-p').classList.replace('text-red-500', 'text-blue-400');
                },

                saveConfig() {
                    app.config.baseValue = parseFloat(document.getElementById('cfg-base').value) || 400;
                    app.config.goals.forEach((g, i) => {
                        g.title = document.getElementById(`cfg-t-${i}`).value;
                        g.weight = parseFloat(document.getElementById(`cfg-w-${i}`).value) || 0;
                    });
                    app.storage.saveConfig();
                    app.ui.showAlert("Parâmetros Atualizados", "As configurações corporativas foram aplicadas para toda a base.", "success");
                }
            }
        };

        window.onload = () => { app.ui.init(); };
    </script>
</body>
</html>
