<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Bonificação</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
                        dark: { bg: '#0f172a', surface: '#1e293b', border: '#334155' }
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Firebase (V8 Compat - Required for direct HTML CDN integration) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .dark .glass-card { background: rgba(30, 41, 59, 0.95); border-color: #334155; }
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-dark-bg dark:text-slate-100 min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Custom Modal System -->
    <div id="global-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-dark-surface rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 border border-slate-200 dark:border-dark-border transform transition-all scale-100">
            <h3 id="modal-title" class="text-lg font-bold mb-2 text-slate-800 dark:text-white flex items-center gap-2"></h3>
            <div id="modal-content" class="text-slate-600 dark:text-slate-300 text-sm mb-6"></div>
            <div id="modal-actions" class="flex justify-end gap-3"></div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div id="pwd-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-dark-surface rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 border border-slate-200 dark:border-dark-border">
            <h3 class="text-lg font-bold mb-4 text-slate-800 dark:text-white"><i class="fa-solid fa-key text-blue-500 mr-2"></i>Trocar Senha</h3>
            <input type="password" id="new-password-input" placeholder="Digite a nova senha" class="w-full p-3 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-600 focus:ring-2 focus:ring-blue-500 mb-4 dark:text-white">
            <div class="flex justify-end gap-3">
                <button onclick="app.ui.closePwdModal()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded font-bold text-sm transition-colors">Cancelar</button>
                <button onclick="app.auth.executeChangePassword()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-bold text-sm shadow-md transition-colors">Salvar</button>
            </div>
        </div>
    </div>

    <!-- LOGIN VIEW -->
    <div id="view-login" class="flex-1 flex items-center justify-center p-4">
        <div class="glass-card max-w-md w-full p-8 rounded-2xl shadow-xl border border-slate-100 dark:border-dark-border text-center">
            <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 shadow-lg">
                <i class="fa-solid fa-chart-pie"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-800 dark:text-white mb-2">Painel de Bonificação</h1>
            <p class="text-slate-500 dark:text-slate-400 mb-8 text-sm">Acesse para acompanhar seus indicadores.</p>
            
            <form onsubmit="event.preventDefault(); app.auth.login();" class="space-y-4">
                <div class="text-left">
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Matrícula (Login)</label>
                    <input type="text" id="login-mat" required class="w-full p-3 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-600 focus:ring-2 focus:ring-blue-500 dark:text-white transition-all outline-none" placeholder="Digite sua matrícula">
                </div>
                <div class="text-left">
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Senha</label>
                    <input type="password" id="login-pwd" required class="w-full p-3 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-600 focus:ring-2 focus:ring-blue-500 dark:text-white transition-all outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 mt-2">
                    Entrar no Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP VIEW (Hidden initially) -->
    <div id="view-app" class="hidden flex-1 flex flex-col pb-[200px]">
        
        <!-- Header Identical to Image -->
        <header class="bg-[#111827] text-white shadow-md z-20">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-chart-pie text-white text-sm"></i>
                        </div>
                        <h1 class="font-bold text-lg tracking-tight">Painel de Bonificação</h1>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="hidden sm:flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-md border border-slate-700">
                            <i class="fa-solid fa-user text-slate-400 text-xs"></i>
                            <span id="header-username" class="text-xs font-bold text-slate-200 tracking-wide uppercase">USUÁRIO</span>
                        </div>
                        <!-- Dark mode toggle -->
                        <button onclick="app.ui.toggleTheme()" class="text-slate-400 hover:text-white transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-800">
                            <i id="theme-icon" class="fa-solid fa-moon"></i>
                        </button>
                        <!-- Logout -->
                        <button onclick="app.auth.logout()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2 rounded-md shadow-sm transition-colors">
                            Sair
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Navigation -->
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 border-t border-slate-700">
                <nav class="flex space-x-1 py-3 overflow-x-auto" id="main-nav">
                    <!-- Dynamic Nav Items injected by JS based on role -->
                </nav>
            </div>
        </header>

        <!-- Content Container -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full relative z-10 flex-1">
            <div id="content-container">
                <!-- Views will be rendered here via JS -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script>
        const app = {
            // Firebase Configuration (Real credentials integrated)
            storage: {
                firebaseConfig: {
                    apiKey: "AIzaSyAgCs3t7AadsPv-k74kz5fU5G02ZT6Xm0I",
                    authDomain: "painel-de-bonificacao.firebaseapp.com",
                    databaseURL: "https://painel-de-bonificacao-default-rtdb.firebaseio.com/",
                    projectId: "painel-de-bonificacao",
                    storageBucket: "painel-de-bonificacao.firebasestorage.app",
                    messagingSenderId: "96589923224",
                    appId: "1:96589923224:web:c81d609302104c62f9a1ed"
                },
                init() {
                    // Initialize Firebase V8
                    if (!firebase.apps.length) {
                        firebase.initializeApp(this.firebaseConfig);
                    }
                    // Listen to Realtime Database
                    firebase.database().ref('sistema_bonificacao').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            if (data.config) {
                                app.config = data.config;
                            }
                            if (data.users) {
                                app.users = data.users;
                            } else {
                                app.users = [];
                            }
                            // Auto-refresh UI if logged in
                            if(app.currentUser || app.isAdmin) {
                                app.ui.refreshCurrentView();
                            }
                        } else {
                            // First time setup empty DB
                            this.saveConfig();
                            this.saveUsers();
                        }
                    });
                },
                saveUsers() {
                    firebase.database().ref('sistema_bonificacao/users').set(app.users);
                },
                saveConfig() {
                    firebase.database().ref('sistema_bonificacao/config').set(app.config);
                }
            },

            // App State
            users: [],
            config: {
                baseValue: 400,
                goals: [
                    { id: 'g1', title: "Monitorias Realizadas", weight: 0.20, type: 'percent', icon: 'fa-headphones' },
                    { id: 'g2', title: "Feedbacks Presenciais", weight: 0.20, type: 'percent', icon: 'fa-comments' },
                    { id: 'g3', title: "Calibragens", weight: 0.15, type: 'boolean', icon: 'fa-handshake' },
                    { id: 'g4', title: "Ações Presenciais", weight: 0.15, type: 'actions', icon: 'fa-users' },
                    { id: 'g5', title: "Frequência", weight: 0.10, type: 'boolean', icon: 'fa-calendar-check' },
                    { id: 'g6', title: "Avaliação Gestor", weight: 0.10, type: 'boolean', icon: 'fa-thumbs-up' },
                    { id: 'g7', title: "Ação Colaborativa", weight: 0.10, type: 'boolean', icon: 'fa-lightbulb' }
                ]
            },
            
            currentUser: null,
            isAdmin: false,
            currentTab: 'meu_painel', // Default tab

            auth: {
                login() {
                    const mat = document.getElementById('login-mat').value.trim();
                    const pwd = document.getElementById('login-pwd').value.trim();
                    
                    if(mat === 'gestaosoft' && pwd === 'qualidade2026') {
                        app.isAdmin = true;
                        app.currentUser = null;
                        app.currentTab = 'dashboard_adm';
                        app.ui.showApp();
                        return;
                    }

                    const user = app.users.find(u => u.matricula === mat && u.senha === pwd);
                    if(user) {
                        app.isAdmin = false;
                        app.currentUser = user;
                        app.currentTab = 'meu_painel';
                        app.ui.showApp();
                    } else {
                        app.ui.showAlert("Acesso Negado", "Matrícula ou senha incorretos.");
                    }
                },
                logout() {
                    app.isAdmin = false;
                    app.currentUser = null;
                    document.getElementById('login-mat').value = '';
                    document.getElementById('login-pwd').value = '';
                    document.getElementById('view-app').classList.add('hidden');
                    document.getElementById('view-login').classList.remove('hidden');
                },
                executeChangePassword() {
                    const newPwd = document.getElementById('new-password-input').value.trim();
                    if(newPwd.length < 3) return app.ui.showAlert("Aviso", "A senha é muito curta.");
                    
                    if(app.currentUser) {
                        const idx = app.users.findIndex(u => u.matricula === app.currentUser.matricula);
                        if(idx > -1) {
                            app.users[idx].senha = newPwd;
                            app.currentUser.senha = newPwd;
                            app.storage.saveUsers();
                            app.ui.closePwdModal();
                            app.ui.showAlert("Sucesso", "Senha alterada com sucesso!", "success");
                        }
                    }
                }
            },

            calc: {
                getGoalResult(goalId, results) {
                    if(!results || !results[goalId]) {
                        return { value: 0, mult: 0, received: 0, display: '-', raw: {} };
                    }
                    
                    const res = results[goalId];
                    const goalDef = app.config.goals.find(g => g.id === goalId);
                    const valueAllocated = app.config.baseValue * goalDef.weight;
                    let mult = 0;
                    let display = '';

                    if(goalDef.type === 'percent') {
                        // Needs Meta and Real
                        const meta = parseFloat(res.meta) || 0;
                        const real = parseFloat(res.real) || 0;
                        const pct = meta > 0 ? (real / meta) : 0;
                        
                        if(pct >= 1.0) mult = 1.0;
                        else if(pct >= 0.95) mult = 0.75;
                        else if(pct >= 0.90) mult = 0.50;
                        else mult = 0;
                        
                        display = `${meta > 0 ? (pct * 100).toFixed(1) : '0.0'}%`;
                    }
                    else if(goalDef.type === 'actions') {
                        const count = parseInt(res.val) || 0;
                        if(count >= 4) mult = 1.0;
                        else if(count === 3) mult = 0.75;
                        else if(count === 2) mult = 0.50;
                        else mult = 0;
                        display = `${count} Ações Realizadas`;
                    }
                    else if(goalDef.type === 'boolean') {
                        const atingido = (res.val === 'Sim');
                        mult = atingido ? 1.0 : 0;
                        display = atingido ? '✓ Atingido' : '✗ Falhou';
                    }

                    return {
                        mult: mult,
                        received: valueAllocated * mult,
                        allocated: valueAllocated,
                        display: display,
                        raw: res
                    };
                },
                
                getTotal(results) {
                    if(!results) return { received: 0, pct: 0 };
                    let totalReceived = 0;
                    app.config.goals.forEach(g => {
                        totalReceived += this.getGoalResult(g.id, results).received;
                    });
                    const pct = app.config.baseValue > 0 ? (totalReceived / app.config.baseValue) : 0;
                    return { received: totalReceived, pct: pct };
                }
            },

            ui: {
                init() {
                    this.checkTheme();
                    app.storage.init();
                    document.getElementById('view-login').classList.remove('hidden');
                },
                
                checkTheme() {
                    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                        document.documentElement.classList.add('dark');
                        document.getElementById('theme-icon').classList.replace('fa-moon', 'fa-sun');
                    } else {
                        document.documentElement.classList.remove('dark');
                        document.getElementById('theme-icon').classList.replace('fa-sun', 'fa-moon');
                    }
                },
                toggleTheme() {
                    const icon = document.getElementById('theme-icon');
                    if (document.documentElement.classList.contains('dark')) {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('theme', 'light');
                        icon.classList.replace('fa-sun', 'fa-moon');
                    } else {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('theme', 'dark');
                        icon.classList.replace('fa-moon', 'fa-sun');
                    }
                    // Re-render charts if they exist to match theme
                    this.refreshCurrentView();
                },

                showAlert(title, message, type = 'info') {
                    const color = type === 'success' ? 'text-green-600' : (type === 'error' ? 'text-red-600' : 'text-blue-600');
                    const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info');
                    
                    document.getElementById('modal-title').innerHTML = `<i class="fa-solid ${icon} ${color}"></i> ${title}`;
                    document.getElementById('modal-content').innerHTML = message;
                    document.getElementById('modal-actions').innerHTML = `
                        <button onclick="document.getElementById('global-modal').classList.add('hidden')" class="px-5 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white rounded-lg font-bold text-sm transition-colors">Entendi</button>
                    `;
                    document.getElementById('global-modal').classList.remove('hidden');
                },

                showConfirm(title, message, confirmCallbackStr, danger = false) {
                    document.getElementById('modal-title').innerHTML = title;
                    document.getElementById('modal-content').innerHTML = message;
                    const btnClass = danger ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700';
                    document.getElementById('modal-actions').innerHTML = `
                        <button onclick="document.getElementById('global-modal').classList.add('hidden')" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded font-bold text-sm transition-colors">Cancelar</button>
                        <button onclick="document.getElementById('global-modal').classList.add('hidden'); ${confirmCallbackStr}" class="px-4 py-2 ${btnClass} text-white rounded font-bold text-sm shadow-md transition-colors">Confirmar</button>
                    `;
                    document.getElementById('global-modal').classList.remove('hidden');
                },

                openPwdModal() { 
                    document.getElementById('new-password-input').value = '';
                    document.getElementById('pwd-modal').classList.remove('hidden'); 
                },
                closePwdModal() { document.getElementById('pwd-modal').classList.add('hidden'); },

                showApp() {
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-app').classList.remove('hidden');
                    document.getElementById('header-username').textContent = app.isAdmin ? 'ADMINISTRADOR' : app.currentUser.nome;
                    this.renderNav();
                    this.renderTab(app.currentTab);
                },

                renderNav() {
                    const nav = document.getElementById('main-nav');
                    let html = '';
                    const tabs = app.isAdmin 
                        ? [ {id:'dashboard_adm', label:'Dashboard ADM', icon:'fa-chart-line'}, {id:'cadastros', label:'Cadastros', icon:'fa-users'}, {id:'configuracoes', label:'Configurações', icon:'fa-cog'}, {id:'meu_painel', label:'Visão Monitor', icon:'fa-eye'}, {id:'regras', label:'Regras', icon:'fa-balance-scale'}, {id:'calculadora', label:'Calculadora', icon:'fa-calculator'} ]
                        : [ {id:'meu_painel', label:'Meu Painel', icon:'fa-chart-pie'}, {id:'regras', label:'Regras', icon:'fa-balance-scale'}, {id:'calculadora', label:'Simulador', icon:'fa-calculator'} ];
                    
                    tabs.forEach(t => {
                        const activeCls = app.currentTab === t.id ? 'bg-[#1e293b] text-white border-b-2 border-blue-500' : 'text-slate-400 hover:text-slate-200 hover:bg-[#1e293b]/50';
                        html += `<button onclick="app.ui.renderTab('${t.id}')" class="px-4 py-3 font-semibold text-sm rounded-t-md transition-all flex items-center gap-2 whitespace-nowrap ${activeCls}"><i class="fa-solid ${t.icon}"></i> ${t.label}</button>`;
                    });
                    nav.innerHTML = html;
                },

                refreshCurrentView() {
                    if(!document.getElementById('view-app').classList.contains('hidden')) {
                        this.renderTab(app.currentTab);
                    }
                },

                renderTab(tabId) {
                    app.currentTab = tabId;
                    this.renderNav();
                    const container = document.getElementById('content-container');
                    container.innerHTML = ''; // Clear

                    if(tabId === 'meu_painel') this.renderView_MeuPainel(container);
                    else if(tabId === 'dashboard_adm') this.renderView_DashboardAdm(container);
                    else if(tabId === 'cadastros') this.renderView_Cadastros(container);
                    else if(tabId === 'configuracoes') this.renderView_Config(container);
                    else if(tabId === 'calculadora') this.renderView_Calculadora(container);
                    else if(tabId === 'regras') this.renderView_Regras(container);
                },

                renderView_MeuPainel(container) {
                    // Se for ADM, seleciona o user. Se for user, pega de app.currentUser
                    let targetUser = app.currentUser;
                    let html = `
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                            <div>
                                <h2 class="text-2xl font-bold text-slate-800 dark:text-white">Painel de Bonificação</h2>
                                <p class="text-slate-500 dark:text-slate-400 text-sm">Acompanhe os indicadores fechados.</p>
                            </div>
                            <div class="flex items-center gap-3">
                    `;
                    
                    if(app.isAdmin) {
                        html += `<select id="adm-view-user" onchange="app.ui.refreshMeuPainelAdm()" class="p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-bold shadow-sm">
                            <option value="">Selecione um monitor...</option>`;
                        app.users.forEach(u => { html += `<option value="${u.matricula}" ${window.selectedViewUser === u.matricula ? 'selected':''}>${u.nome}</option>`; });
                        html += `</select>`;
                        if(window.selectedViewUser) targetUser = app.users.find(u => u.matricula === window.selectedViewUser);
                    } else {
                        html += `<button onclick="app.ui.openPwdModal()" class="flex items-center gap-2 px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-600 dark:text-slate-200 font-bold text-sm shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition"><i class="fa-solid fa-key text-blue-500"></i> Trocar Senha</button>`;
                    }
                    html += `</div></div>`;

                    if(!targetUser && app.isAdmin) {
                        container.innerHTML = html + `<div class="p-8 text-center text-slate-500 glass-card rounded-xl">Selecione um monitor acima para visualizar o painel dele.</div>`;
                        return;
                    }

                    // Render Cards
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">`;
                    
                    const results = targetUser.results || {};
                    const total = app.calc.getTotal(results);

                    app.config.goals.forEach(g => {
                        const r = app.calc.getGoalResult(g.id, results);
                        const isPercentGoal = g.type === 'percent';
                        const wPct = (g.weight * 100).toFixed(1);
                        const multColor = r.mult >= 1 ? 'text-green-500' : (r.mult > 0 ? 'text-yellow-500' : 'text-red-500');

                        html += `
                        <div class="glass-card rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-dark-border flex flex-col justify-between">
                            <div class="flex justify-between items-start mb-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-blue-50 dark:bg-blue-900/30 flex items-center justify-center text-blue-600 dark:text-blue-400">
                                        <i class="fa-solid ${g.icon}"></i>
                                    </div>
                                    <h3 class="font-bold text-sm text-slate-800 dark:text-slate-200 leading-tight">${g.title}</h3>
                                </div>
                                <span class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-xs font-bold px-2 py-1 rounded">${wPct}%</span>
                            </div>
                            
                            <div class="flex-1 flex flex-col justify-center mb-4">
                        `;
                        
                        if(isPercentGoal) {
                            html += `
                                <div class="grid grid-cols-2 gap-2 mb-2">
                                    <div class="text-center">
                                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-1">Meta Oficial</div>
                                        <div class="bg-slate-50 dark:bg-slate-800/50 rounded py-2 font-bold text-slate-700 dark:text-slate-300 text-sm border border-slate-100 dark:border-slate-700">${r.raw.meta || '-'}</div>
                                    </div>
                                    <div class="text-center">
                                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-1">Seu Realizado</div>

                            <div class="glass-card p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-dark-border">
                                <h3 class="font-bold text-lg mb-4 text-blue-600 dark:text-blue-400"><i class="fa-solid fa-users mr-2"></i>Ações Presenciais</h3>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-sm text-left text-slate-600 dark:text-slate-300 border-collapse">
                                        <thead class="bg-slate-100 dark:bg-slate-800 font-bold uppercase text-xs">
                                            <tr><th class="p-3 rounded-tl-lg">Ações Realizadas</th><th class="p-3 rounded-tr-lg">Múltiplo de Recebimento</th></tr>
                                        </thead>
                                        <tbody>
                                            <tr class="border-b border-slate-100 dark:border-slate-800/50"><td class="p-3">4 Ações Distintas</td><td class="p-3 font-bold text-green-500">100% do valor</td></tr>
                                            <tr class="border-b border-slate-100 dark:border-slate-800/50"><td class="p-3">3 Ações Distintas</td><td class="p-3 font-bold text-yellow-500">75% do valor</td></tr>
                                            <tr class="border-b border-slate-100 dark:border-slate-800/50"><td class="p-3">2 Ações Distintas</td><td class="p-3 font-bold text-orange-500">50% do valor</td></tr>
                                            <tr><td class="p-3">0 a 1 Ação</td><td class="p-3 font-bold text-red-500">0% (Zerado)</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            
                            <!-- Checkboxes -->
                            <div class="glass-card p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-dark-border flex items-start gap-4">
                                <div class="w-10 h-10 bg-slate-100 dark:bg-slate-800 rounded flex items-center justify-center text-slate-400 shrink-0"><i class="fa-solid fa-toggle-on"></i></div>
                                <div>
                                    <h3 class="font-bold text-slate-800 dark:text-white mb-2">Metas de Status (Calibragem, Frequência, Avaliação, Colaborativa)</h3>
                                    <p class="text-sm text-slate-600 dark:text-slate-400">Estas metas funcionam no formato binário. Se a regra for cumprida (Sim), recebe 100% da verba alocada. Se houver falha (Não), perde 100% da verba alocada.</p>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML = html;
                }
            },

            admin: {
                registerUser() {
                    const n = document.getElementById('cad-nome').value.trim();
                    const m = document.getElementById('cad-mat').value.trim();
                    const p = document.getElementById('cad-pwd').value.trim();
                    if(!n || !m || !p) return app.ui.showAlert("Aviso", "Preencha todos os campos.");
                    if(app.users.find(u => u.matricula === m)) return app.ui.showAlert("Erro", "Matrícula já cadastrada.", "error");
                    
                    app.users.push({ nome: n, matricula: m, senha: p, results: {} });
                    app.storage.saveUsers();
                    document.getElementById('cad-nome').value = ''; document.getElementById('cad-mat').value = ''; document.getElementById('cad-pwd').value = '';
                    app.ui.showAlert("Sucesso", "Monitor cadastrado com sucesso!", "success");
                    app.ui.refreshCurrentView();
                },

                loadUserEditor() {
                    const mat = document.getElementById('adm-user-select').value;
                    const area = document.getElementById('adm-editor-area');
                    if(!mat) { area.classList.add('hidden'); return; }
                    
                    const u = app.users.find(x => x.matricula === mat);
                    const res = u.results || {};
                    
                    let html = `
                        <div class="flex justify-between items-center bg-slate-100 dark:bg-slate-800 p-3 rounded-lg mb-4">
                            <div><span class="text-xs text-slate-500 block uppercase font-bold">Senha Atual:</span><code class="text-sm font-bold text-slate-700 dark:text-slate-300">${u.senha}</code></div>
                            <div class="flex gap-2">
                                <button onclick="app.admin.clearUser()" class="px-3 py-1 bg-orange-100 text-orange-600 hover:bg-orange-200 rounded text-xs font-bold transition">Limpar Dados</button>
                                <button onclick="app.admin.deleteUser()" class="px-3 py-1 bg-red-100 text-red-600 hover:bg-red-200 rounded text-xs font-bold transition"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    `;

                    app.config.goals.forEach(g => {
                        const val = res[g.id] || {};
                        html += `<div class="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-2">${g.title}</label>
                        `;
                        
                        if(g.type === 'percent') {
                            html += `
                                <div class="flex gap-2">
                                    <div class="flex-1"><span class="text-[10px] text-slate-400 block mb-1">Meta Oficial</span><input type="number" id="ed-${g.id}-meta" class="w-full p-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded text-sm dark:text-white" value="${val.meta || ''}"></div>
                                    <div class="flex-1"><span class="text-[10px] text-blue-400 block mb-1 font-bold">Realizado</span><input type="number" id="ed-${g.id}-real" class="w-full p-2 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded text-sm font-bold text-blue-600 dark:text-blue-400" value="${val.real || ''}"></div>
                                </div>
                            `;
                        } else if(g.type === 'actions') {
                            html += `<input type="number" id="ed-${g.id}-val" class="w-full p-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded text-sm dark:text-white" placeholder="Qtd Ações (0 a 4)" min="0" max="4" value="${val.val || ''}">`;
                        } else {
                            html += `<select id="ed-${g.id}-val" class="w-full p-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded text-sm dark:text-white">
                                <option value="" ${!val.val ? 'selected':''}>Não Preenchido</option>
                                <option value="Sim" ${val.val==='Sim'?'selected':''}>Sim (Atingiu)</option>
                                <option value="Não" ${val.val==='Não'?'selected':''}>Não (Falhou)</option>
                            </select>`;
                        }
                        html += `</div>`;
                    });

                    html += `
                        </div>
                        <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-700">
                            <button onclick="app.admin.saveUserResults()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5">
                                Salvar Resultados deste Monitor
                            </button>
                        </div>
                    `;
                    area.innerHTML = html;
                    area.classList.remove('hidden');
                },

                saveUserResults() {
                    const mat = document.getElementById('adm-user-select').value;
                    const u = app.users.find(x => x.matricula === mat);
                    if(!u) return;

                    const newRes = {};
                    app.config.goals.forEach(g => {
                        if(g.type === 'percent') {
                            const m = document.getElementById(`ed-${g.id}-meta`).value;
                            const r = document.getElementById(`ed-${g.id}-real`).value;
                            if(m !== '' || r !== '') newRes[g.id] = { meta: m, real: r };
                        } else {
                            const v = document.getElementById(`ed-${g.id}-val`).value;
                            if(v !== '') newRes[g.id] = { val: v };
                        }
                    });
                    
                    u.results = newRes;
                    app.storage.saveUsers();
                    app.ui.showAlert("Sucesso", "Resultados atualizados com sucesso!", "success");
                },

                clearUser() { app.ui.showConfirm("Atenção", "Deseja realmente ZERAR os resultados deste monitor neste mês?", "app.admin.executeClearUser()", true); },
                executeClearUser() {
                    const u = app.users.find(x => x.matricula === document.getElementById('adm-user-select').value);
                    if(u) { u.results = {}; app.storage.saveUsers(); this.loadUserEditor(); }
                },

                deleteUser() { app.ui.showConfirm("Cuidado!", "Excluir permanentemente este monitor do sistema?", "app.admin.executeDeleteUser()", true); },
                executeDeleteUser() {
                    app.users = app.users.filter(u => u.matricula !== document.getElementById('adm-user-select').value);
                    app.storage.saveUsers();
                    app.ui.refreshCurrentView();
                },

                updateConfigPreview() {
                    let wTotal = 0;
                    app.config.goals.forEach((g, i) => {
                        const val = parseFloat(document.getElementById(`cfg-w-${i}`).value) || 0;
                        wTotal += val;
                        document.getElementById(`cfg-p-${i}`).textContent = `${(val*100).toFixed(0)}%`;
                    });
                    document.getElementById('cfg-total-w').textContent = wTotal.toFixed(2);
                    document.getElementById('cfg-total-p').textContent = `${(wTotal*100).toFixed(0)}%`;
                    if(Math.abs(wTotal - 1.0) > 0.001) document.getElementById('cfg-total-p').classList.replace('text-blue-600', 'text-red-500');
                    else document.getElementById('cfg-total-p').classList.replace('text-red-500', 'text-blue-600');
                },

                saveConfig() {
                    app.config.baseValue = parseFloat(document.getElementById('cfg-base').value) || 400;
                    app.config.goals.forEach((g, i) => {
                        g.title = document.getElementById(`cfg-t-${i}`).value;
                        g.weight = parseFloat(document.getElementById(`cfg-w-${i}`).value) || 0;
                    });
                    app.storage.saveConfig();
                    app.ui.showAlert("Sucesso", "Configurações Globais atualizadas!", "success");
                }
            }
        };

        // Bootstrap App
        window.onload = () => { app.ui.init(); };
    </script>
</body>
</html>
